name: Gmail & Calendar Briefing

on:
  schedule:
      # Monday-Friday at 7:45 AM CST (9:45 AM UTC)
          - cron: '45 14 * * 1-5'
            workflow_dispatch:

            jobs:
              briefing:
                  runs-on: ubuntu-latest
                      steps:
                            - uses: actions/checkout@v4
                                  - uses: actions/setup-node@v4
                                          with:
                                                    node-version: '22'

                                                          - name: Install dependencies
                                                                  run: npm install

                                                                        - name: Run Gmail and Calendar Briefing
                                                                                env:
                                                                                          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
                                                                                                    GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
                                                                                                            run: node scripts/gmail-calendar-briefing.js
                                                                                                            
                                                                                                                  - name: Upload briefing report
                                                                                                                          uses: actions/upload-artifact@v4
                                                                                                                                  if: always()
                                                                                                                                          with:
                                                                                                                                                    name: briefing-report
                                                                                                                                                              path: ./reports/briefing.json
                                                                                                                                                                        retention-days: 30
