name: Daily Briefing v2

on:
  schedule:
    # 7:45 AM CST = 1:45 PM UTC (CST is UTC-6)
    - cron: '45 13 * * 1-5'  # Monday-Friday at 1:45 PM UTC
  workflow_dispatch:  # Manual trigger option

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run daily briefing
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        run: node scripts/daily-briefing-v2.js
      
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-report-${{ github.run_number }}
          path: reports/briefing-*.json
          retention-days: 30
        if: always()
