name: Daily Briefing

on:
  schedule:
    - cron: '45 12 * * *'
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: Run Daily Briefing
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/daily-briefing.js

      - name: Upload HTML as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Briefing-Report
          path: reports/Daily_Briefing_*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload HTML to Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          FILE=$(find . -name "Daily_Briefing_*.html" | head -1)
          FILESIZE=$(wc -c < "$FILE" | tr -d ' ')
          FILENAME=$(basename "$FILE")
          DATE=$(TZ="America/Chicago" date +'%b %d, %Y %I:%M %p CT')

          UPLOAD=$(curl -s -X POST "https://slack.com/api/files.getUploadURLExternal" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "filename=${FILENAME}" \
            --data-urlencode "length=${FILESIZE}")

          UPLOAD_URL=$(echo "$UPLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('upload_url',''))")
          FILE_ID=$(echo "$UPLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('file_id',''))")

          curl -s -X POST "$UPLOAD_URL" --data-binary @"$FILE"

          curl -s -X POST "https://slack.com/api/files.completeUploadExternal" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"files\":[{\"id\":\"${FILE_ID}\",\"title\":\"Daily Briefing — ${DATE}\"}],\"channel_id\":\"${SLACK_CHANNEL_ID}\",\"initial_comment\":\"📋 *Daily Briefing — ${DATE}*\nDownload and open in Chrome.\"}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-logs
          path: logs/
          if-no-files-found: ignore
