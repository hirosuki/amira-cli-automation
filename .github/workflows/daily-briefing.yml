name: Daily Briefing

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 9 AM UTC, Monday-Friday
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run daily briefing script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: daily-briefing
        run: node scripts/daily-briefing-v2.js
      
      - name: Upload briefing report
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-report
          path: ./reports/briefing.json
          retention-days: 30
        if: always()
