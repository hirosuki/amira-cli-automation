name: Daily Briefing

on:
  schedule:
    - cron: '45 12 * * 1-5'  # 12:45 UTC = 7:45 AM EST (Mon-Fri)
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Run daily briefing script
        env:
          # Google OAuth2 token JSON (with client_id + refresh_token)
          # OR service account JSON (requires GOOGLE_SUBJECT_EMAIL for domain-wide delegation)
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # Only needed if using a service account with domain-wide delegation
          GOOGLE_SUBJECT_EMAIL: ${{ secrets.GOOGLE_SUBJECT_EMAIL }}
          # Slack incoming webhook URL (for posting the briefing)
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          # Slack bot/user OAuth token (xoxb-... or xoxp-...) for fetching mentions
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Your Slack member ID (e.g. U01XXXXXXXX) — used to search for @mentions
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
        run: node scripts/daily-briefing.js

      - uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-report
          path: ./reports/briefing.json
          retention-days: 30
        if: always()
