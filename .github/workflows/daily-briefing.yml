name: Daily Briefing

on:
  schedule:
      - cron: '0 9 * * 1-5'
        workflow_dispatch:

        jobs:
          daily-briefing:
              runs-on: ubuntu-latest
                  steps:
                        - name: Checkout repository
                                uses: actions/checkout@v4

                                      - name: Set up Node.js
                                              uses: actions/setup-node@v4
                                                      with:
                                                                node-version: '22'

                                                                      - name: Install dependencies
                                                                              run: npm install

                                                                                    - name: Run daily briefing script
                                                                                            env:
                                                                                                      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
                                                                                                                SF_USERNAME: ${{ secrets.SF_USERNAME }}
                                                                                                                          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
                                                                                                                                    SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
                                                                                                                                              SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
                                                                                                                                                        SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
                                                                                                                                                                  SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
                                                                                                                                                                            SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                                                                                                                                                                                    run: node scripts/daily-briefing.js
                                                                                                                                                                                    
                                                                                                                                                                                          - name: Upload briefing report
                                                                                                                                                                                                  uses: actions/upload-artifact@v4
                                                                                                                                                                                                          with:
                                                                                                                                                                                                                    name: daily-briefing-report
                                                                                                                                                                                                                              path: ./reports/briefing.json
                                                                                                                                                                                                                                        retention-days: 30
                                                                                                                                                                                                                                                if: always()
