name: Daily Briefing

on:
  schedule:
      # Run at 7:45 AM CST, Monday-Friday (12:45 UTC)
          - cron: '45 12 * * 1-5'
            workflow_dispatch:

            jobs:
              daily-briefing:
                  runs-on: ubuntu-latest

                          steps:
                                - name: Checkout code
                                        uses: actions/checkout@v4

                                              - name: Setup Node.js
                                                      uses: actions/setup-node@v4
                                                              with:
                                                                        node-version: '22'

                                                                              - name: Debug - Check environment
                                                                                      run: |
                                                                                                echo "Environment Debug Info"
                                                                                                          echo "Node version: $(node --version)"
                                                                                                                    echo "NPM version: $(npm --version)"
                                                                                                                              echo "Working directory: $(pwd)"
                                                                                                                                        echo "Files:"
                                                                                                                                                  ls -la
                                                                                                                                                            echo ""
                                                                                                                                                                      echo "Checking secrets..."
                                                                                                                                                                                echo "GOOGLE_CREDENTIALS set: $([ -z "$GOOGLE_CREDENTIALS" ] && echo 'NO' || echo 'YES')"
                                                                                                                                                                                          echo "SLACK_WEBHOOK set: $([ -z "$SLACK_WEBHOOK" ] && echo 'NO' || echo 'YES')"
                                                                                                                                                                                                    echo "SF_USERNAME set: $([ -z "$SF_USERNAME" ] && echo 'NO' || echo 'YES')"
                                                                                                                                                                                                    
                                                                                                                                                                                                          - name: Install dependencies
                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                            npm install
                                                                                                                                                                                                                                      echo "Dependencies installed"
                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                            - name: Run daily briefing script
                                                                                                                                                                                                                                                    env:
                                                                                                                                                                                                                                                              GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
                                                                                                                                                                                                                                                                        GOOGLE_TOKENS: ${{ secrets.GOOGLE_TOKENS }}
                                                                                                                                                                                                                                                                                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
                                                                                                                                                                                                                                                                                            SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
                                                                                                                                                                                                                                                                                                      SF_USERNAME: ${{ secrets.SF_USERNAME }}
                                                                                                                                                                                                                                                                                                                SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
                                                                                                                                                                                                                                                                                                                          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
                                                                                                                                                                                                                                                                                                                                    SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
                                                                                                                                                                                                                                                                                                                                              SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
                                                                                                                                                                                                                                                                                                                                                        SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
                                                                                                                                                                                                                                                                                                                                                                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                    echo "Running daily briefing script..."
                                                                                                                                                                                                                                                                                                                                                                                              node scripts/daily-briefing.js
                                                                                                                                                                                                                                                                                                                                                                                                        echo "Script completed"
                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                              - name: Check report
                                                                                                                                                                                                                                                                                                                                                                                                                      if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "Checking generated report..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if [ -f ./reports/briefing.json ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "Report generated successfully"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "Report contents:"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      cat ./reports/briefing.json
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "No report file found!"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ls -la ./reports/ 2>/dev/null || echo "Reports directory not found"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Upload artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          name: daily-briefing-report
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    path: ./reports/briefing.json
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              retention-days: 30
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if-no-files-found: warn
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Failure notification
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if: failure()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if [ ! -z "$SLACK_WEBHOOK" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      curl -X POST "$SLACK_WEBHOOK" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    -H 'Content-Type: application/json' \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  -d '{"text": "Daily Briefing Workflow Failed","blocks": [{"type": "section","text": {"type": "mrkdwn","text": "*Daily Briefing Workflow Failed*\n\nRun: '$(echo $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)'\n\nCheck logs for details."}}]}'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
