name: Daily Briefing

on:
  schedule:
    - cron: '55 13 * * 1-5'
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: Run Daily Briefing
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node scripts/daily-briefing.js

      - name: Upload HTML as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Briefing-Report
          path: reports/Daily_Briefing_*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Publish to Gist and post link to Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          FILE=$(find . -name "Daily_Briefing_*.html" | head -1)
          FILENAME=$(basename "$FILE")
          DATE=$(TZ="America/Chicago" date +'%b %d, %Y %I:%M %p CT')
          CONTENT=$(cat "$FILE")

          GIST_RESPONSE=$(curl -s -X POST "https://api.github.com/gists" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"Daily Briefing ${DATE}\",\"public\":true,\"files\":{\"${FILENAME}\":{\"content\":$(echo "$CONTENT" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}}}")

          RAW_URL=$(echo "$GIST_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); files=d.get('files',{}); f=list(files.values())[0]; print(f.get('raw_url',''))" 2>/dev/null || echo "")
          PREVIEW_URL="https://htmlpreview.github.io/?${RAW_URL}"

          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${SLACK_CHANNEL_ID}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"📋 *Daily Briefing — ${DATE}*\nClick below to open in your browser.\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"🌐 Open Briefing\", \"emoji\": true },
                      \"url\": \"${PREVIEW_URL}\",
                      \"style\": \"primary\"
                    }
                  ]
                }
              ]
            }"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-logs
          path: logs/
          if-no-files-found: ignore
