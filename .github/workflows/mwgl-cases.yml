name: MWGL Case Report

on:
  schedule:
    - cron: '50 13 * * 1-5'
  workflow_dispatch:

jobs:
  mwgl-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios json2csv googleapis

      - name: Run MWGL Case Report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          SF_SESSION_ID: ${{ secrets.SF_SESSION_ID }}
        run: node mwgl-cases.js

      - name: Upload HTML report as artifact
        if: success()
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: MWGL-Case-Report
          path: dashboard/MWGL_Cases_*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Post download link to Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          REPORT_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${SLACK_CHANNEL}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"📊 *MWGL HTML Report Ready*\n1. Click the button below\n2. Scroll to *Artifacts* at the bottom\n3. Click *MWGL-Case-Report* to download\n4. Unzip and open the *.html* file in Chrome\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"⬇️ Download HTML Report\", \"emoji\": true },
                      \"url\": \"${REPORT_URL}\",
                      \"style\": \"primary\"
                    }
                  ]
                }
              ]
            }"
