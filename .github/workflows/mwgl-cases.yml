name: MWGL Case Report

on:
  schedule:
    - cron: '50 13 * * 1-5'
  workflow_dispatch:

jobs:
  mwgl-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios json2csv googleapis

      - name: Run MWGL Case Report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          SF_SESSION_ID: ${{ secrets.SF_SESSION_ID }}
        run: node mwgl-cases.js

      - name: Upload HTML report as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MWGL-Case-Report
          path: dashboard/MWGL_Cases_*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Publish to Gist and post link to Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          FILE=$(find . -name "MWGL_Cases_*.html" | head -1)
          FILENAME=$(basename "$FILE")
          DATE=$(TZ="America/Chicago" date +'%b %d, %Y %I:%M %p CT')
          CONTENT=$(cat "$FILE")

          # Upload to GitHub Gist (public) — returns a direct HTML URL
          GIST_RESPONSE=$(curl -s -X POST "https://api.github.com/gists" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"MWGL Case Report ${DATE}\",\"public\":true,\"files\":{\"${FILENAME}\":{\"content\":$(echo "$CONTENT" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}}}")

          GIST_URL=$(echo "$GIST_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('html_url',''))")
          # Convert gist URL to raw rendered URL via htmlpreview.github.io
          RAW_URL=$(echo "$GIST_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); files=d.get('files',{}); f=list(files.values())[0]; print(f.get('raw_url',''))" 2>/dev/null || echo "")
          PREVIEW_URL="https://htmlpreview.github.io/?${RAW_URL}"

          echo "Gist URL: $GIST_URL"
          echo "Preview URL: $PREVIEW_URL"

          # Post clickable link to Slack
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${SLACK_CHANNEL_ID}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"📊 *MWGL Case Report — ${DATE}*\nClick below to open the dashboard in your browser.\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"🌐 Open Dashboard\", \"emoji\": true },
                      \"url\": \"${PREVIEW_URL}\",
                      \"style\": \"primary\"
                    }
                  ]
                }
              ]
            }"
