name: MWGL Case Report

on:
  schedule:
    - cron: '50 13 * * 1-5'
  workflow_dispatch:

jobs:
  mwgl-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios json2csv googleapis

      - name: Run MWGL Case Report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          SF_SESSION_ID: ${{ secrets.SF_SESSION_ID }}
        run: node mwgl-cases.js

      - name: Upload HTML report as artifact
        if: success()
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: MWGL-Case-Report
          path: dashboard/MWGL_Cases_*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Post download link to Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get artifact download URL directly from GitHub API
          ARTIFACT_URL=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            | python3 -c "import sys,json; artifacts=json.load(sys.stdin)['artifacts']; print(next((a['archive_download_url'] for a in artifacts if a['name']=='MWGL-Case-Report'), ''))")

          DATE=$(TZ="America/Chicago" date +'%b %d, %Y %I:%M %p CT')

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${SLACK_CHANNEL}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"📊 *MWGL HTML Report Ready — ${DATE}*\nClick to download the HTML dashboard. Unzip and open in Chrome.\"
                  }
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {
                      \"type\": \"button\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"⬇️ Download HTML Report\", \"emoji\": true },
                      \"url\": \"${ARTIFACT_URL}\",
                      \"style\": \"primary\"
                    }
                  ]
                }
              ]
            }"
