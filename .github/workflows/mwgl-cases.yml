name: MWGL Case Report

on:
  schedule:
    - cron: '50 13 * * 1-5'
  workflow_dispatch:

jobs:
  mwgl-cases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios json2csv googleapis

      - name: Run MWGL Case Report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          SF_SESSION_ID: ${{ secrets.SF_SESSION_ID }}
        run: node mwgl-cases.js

      - name: Upload HTML report as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MWGL-Case-Report
          path: dashboard/MWGL_Cases_*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload HTML to Slack
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          FILE=$(find . -name "MWGL_Cases_*.html" | head -1)
          FILENAME=$(basename "$FILE" .html)
          DATE=$(TZ="America/Chicago" date +'%b %d, %Y %I:%M %p CT')

          # Zip so Slack shows a download button instead of rendering code
          zip "${FILENAME}.zip" "$FILE"
          ZIPFILE="${FILENAME}.zip"
          FILESIZE=$(wc -c < "$ZIPFILE" | tr -d ' ')

          UPLOAD=$(curl -s -X POST "https://slack.com/api/files.getUploadURLExternal" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "filename=${FILENAME}.zip" \
            --data-urlencode "length=${FILESIZE}")

          UPLOAD_URL=$(echo "$UPLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('upload_url',''))")
          FILE_ID=$(echo "$UPLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('file_id',''))")

          curl -s -X POST "$UPLOAD_URL" --data-binary @"$ZIPFILE"

          curl -s -X POST "https://slack.com/api/files.completeUploadExternal" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"files\":[{\"id\":\"${FILE_ID}\",\"title\":\"MWGL Case Report — ${DATE}\"}],\"channel_id\":\"${SLACK_CHANNEL_ID}\",\"initial_comment\":\"📊 *MWGL Case Report — ${DATE}*\nClick the zip → download → unzip → open in Chrome.\"}"
