name: Assessment Checker

on:
  workflow_dispatch:
    inputs:
      district_name:
        description: 'District name (e.g., Gonzales Unified School District)'
        required: true
        type: string
  repository_dispatch:
    types: [check-assessment]

jobs:
  impersonate-and-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Determine district name
        id: get-district
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DISTRICT="${{ github.event.inputs.district_name }}"
          else
            DISTRICT="${{ github.event.client_payload.district_name }}"
          fi
          echo "district=$DISTRICT" >> $GITHUB_OUTPUT
          echo "✅ District: $DISTRICT"

      - name: Create Playwright script
        run: |
          cat > impersonate.js << 'SCRIPT'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function main() {
            const districtName = process.env.DISTRICT_NAME;
            const sessionCookie = process.env.SLACK_SESSION_COOKIE;

            console.log(`🏫 Running for district: ${districtName}`);

            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });

            // Set Slack session cookie
            await context.addCookies([{
              name: 'd',
              value: decodeURIComponent(sessionCookie),
              domain: '.slack.com',
              path: '/',
              secure: true,
              httpOnly: true,
              sameSite: 'None'
            }]);

            const page = await context.newPage();

            // Navigate to #impersonate-prod
            console.log('🔗 Navigating to #impersonate-prod...');
            await page.goto('https://amiralearning.slack.com/archives/C099HJNDW59', {
              waitUntil: 'networkidle',
              timeout: 30000
            });
            await page.waitForTimeout(4000);
            await page.screenshot({ path: '01_slack_loaded.png' });

            // Check if we landed on Slack properly
            const title = await page.title();
            console.log(`📄 Page title: ${title}`);

            if (title.includes('Sign in') || title.includes('Login')) {
              console.error('❌ Session cookie expired or invalid - not logged in');
              await page.screenshot({ path: '02_login_required.png' });
              process.exit(1);
            }

            // Wait for message input
            console.log('⌨️  Looking for message input...');
            const messageInput = await page.waitForSelector(
              '[data-qa="message_input"], .ql-editor, [contenteditable="true"]',
              { timeout: 20000 }
            );

            await messageInput.click();
            await page.waitForTimeout(500);

            // Type the slash command
            console.log(`📨 Typing /impersonate-district ${districtName}...`);
            await page.keyboard.type(`/impersonate-district ${districtName}`);
            await page.waitForTimeout(1500);
            await page.screenshot({ path: '02_before_send.png' });

            // Send the command
            await page.keyboard.press('Enter');
            console.log('⏳ Waiting for bot response...');
            await page.waitForTimeout(6000);
            await page.screenshot({ path: '03_after_send.png' });

            // Extract impersonation URL
            const url = await page.evaluate(() => {
              const links = document.querySelectorAll('a[href*="teacher.app.amiralearning.com"]');
              for (const link of links) {
                if (link.href.includes('userId=')) {
                  return link.href;
                }
              }
              // Also check plain text in messages
              const messages = document.querySelectorAll('[data-qa="message_content"]');
              for (const msg of messages) {
                const text = msg.innerText || '';
                const match = text.match(/https:\/\/teacher\.app\.amiralearning\.com[^\s]*/);
                if (match) return match[0];
              }
              return null;
            });

            if (!url) {
              console.error('❌ No impersonation URL found in thread');
              await browser.close();
              process.exit(1);
            }

            console.log(`✅ Found impersonation URL: ${url}`);
            fs.writeFileSync('impersonation_url.txt', url);

            await browser.close();
          }

          main().catch(err => {
            console.error('💥 Script error:', err);
            process.exit(1);
          });
          SCRIPT

      - name: Run impersonation script
        run: node impersonate.js
        env:
          DISTRICT_NAME: ${{ steps.get-district.outputs.district }}
          SLACK_SESSION_COOKIE: ${{ secrets.SLACK_SESSION_COOKIE }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'

      - name: Upload impersonation URL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: impersonation-link
          path: impersonation_url.txt

      - name: Summary
        if: success()
        run: |
          URL=$(cat impersonation_url.txt)
          echo "## ✅ Impersonation Link Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**District:** ${{ steps.get-district.outputs.district }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
